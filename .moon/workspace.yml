# Configures all projects within the workspace to create a project graph.
# Accepts a list of globs, a mapping of projects to relative file paths,
# or both values.
projects:
  desktop: "apps/desktop"
  web-backend: "apps/web/backend"
  web-frontend: "apps/web/frontend"

vcs:
  client: git
  # The default branch / base.
  defaultBranch: "main"
  sync: true
  hooks:
    commit-msg:
      - "deno run --allow-run --allow-read scripts/commit-msg.ts $ARG1"
    pre-commit:
      - "cargo fmt"
      - "echo \"hi\""

  provider: "github"
