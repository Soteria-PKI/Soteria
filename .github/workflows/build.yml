on:
  push:
    branches: [main]

jobs:
  build:
    name: "Build"
    permissions:
      contents: write
    strategy:
      matrix:
        platform: [macos-latest, ubuntu-26.04, ubuntu-26.04-arm, windows-latest]
    runs-on: ${{matrix.platform}}
    steps:
      - name: "Checkout code"
        uses: actions/checkout@v7

      - name: "Install Linux dependencies"
        if: ${{matrix.platform == 'ubuntu-26.04' || matrix.platform == 'ubuntu-26.04-arm'}}
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: "Install Rust toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1

      - name: "Cache Rust downloads"
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: "soteria"
          workspaces: ". -> target"

      - name: "Install moon"
        uses: moonrepo/setup-toolchain@v0.6.4

      - name: "Setup moon"
        run: moon setup
      
      - name: "Build binaries"
        run: moon run desktop:build-app

      - name: "Build artifacts"
        uses: actions/upload-artifact@v7
        with:
          name: soteria-${{ matrix.platform }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 90
